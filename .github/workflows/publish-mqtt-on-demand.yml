name: Publish MQTT Demo Stream On Demand

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "How long to publish MQTT data, in seconds"
        required: false
        default: "600"

concurrency:
  group: mqtt-demo-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MQTT publisher
        env:
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_TLS: "true"
          MQTT_TOPIC_TEMPLATE: comp5339/task123/measurements/{facility_code}
          OPEN_ELECTRICITY_API_KEY: ${{ secrets.OPEN_ELECTRICITY_API_KEY }}
          PUBLISH_DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: python scripts/run_publisher.py
