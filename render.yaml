services:
  - type: web
    name: nem-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
    envVars:
      - key: STREAM_CACHE_SNAPSHOT_PATH
        value: data/cache/stream_cache_snapshot.json
